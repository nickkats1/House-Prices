name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy --strict)
        run: mypy

      - name: Test
        run: pytest --cov=prices --cov=app --cov-report=term-missing

      - name: App smoke test (/healthz)
        run: |
          python -m flask --app app run --port 8765 &
          APP_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/healthz > /tmp/healthz.json; then
              break
            fi
            sleep 0.5
          done
          kill "$APP_PID" 2>/dev/null || true
          cat /tmp/healthz.json
          python -c "import json; assert json.load(open('/tmp/healthz.json'))['status'] == 'ok'"
